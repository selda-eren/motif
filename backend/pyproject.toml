[project]
name = "motif"
version = "0.1.0"
description = "MOTIF: Meaning-Oriented Text Interrelationship Framework (prototype)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "httpx>=0.27",
    "networkx>=3.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["motif"]

[tool.pytest.ini_options]
testpaths = ["tests"]
